<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランダム3桁数字ジェネレーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 40px;
            background-color: #f5f5f7;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0077ed;
        }
        .result-area {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f0f5;
            border-radius: 6px;
            text-align: center;
            min-height: 60px;
        }
        .result-number {
            font-size: 32px;
            font-weight: bold;
            color: #0071e3;
            margin: 0;
        }
        .error-message {
            color: #ff3b30;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>URLから数字を生成</h2>
    
    <div class="form-group">
        <label for="urlInput">URLを入力してください：</label>
        <input type="text" id="urlInput" placeholder="https://example.com" required>
    </div>
    
    <button id="generateBtn">数字を出力する</button>
    
    <div class="result-area">
        <p id="resultDisplay" style="color: #888; margin: 15px 0;">ここに結果が表示されます</p>
    </div>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', function() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const resultDisplay = document.getElementById('resultDisplay');

        // 記入欄が空欄かどうかのチェック
        if (urlInput === "") {
            resultDisplay.innerHTML = '<span class="error-message">URLを入力してください。</span>';
            return;
        }

        // 100から999までのランダムな3桁の数字を生成
        const randomNumber = Math.floor(Math.random() * 900) + 100;

        // 画面に表示
        resultDisplay.innerHTML = `生成された数字：<p class="result-number">${randomNumber}</p>`;
    });
</script>

</body>
</html>
